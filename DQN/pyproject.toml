[project]
name = "dqn"
version = "0.1.0"
description = "Deep Q network used to balance cartpole."
readme = "README.md"
authors = [
    { name = "Rijan Bhattarai", email = "rijanbhattarai2006@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "gymnasium[classic-control]>=1.3.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "seaborn>=0.13.2",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "tqdm>=4.70.1",
]

[project.scripts]
dqn = "dqn.main:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
